- name:  Check if ~/.asdf exists
  stat:
    path: "{{ lookup('env', 'HOME') }}/.asdf"
  register: asdf
  tags:
    - asdf

- name: Clone asdf
  ansible.builtin.git:
    repo: https://github.com/asdf-vm/asdf.git
    dest: "{{ lookup('env', 'HOME') }}/.asdf"
    version: v0.14.0
  when: asdf.stat.exists == False
  tags:
    - asdf
