- hosts: localhost
  pre_tasks:
    - name: Update apt repositories
      apt:
        update_cache: true
      become: true
      tags:
        - dotfiles
        - bat
  tasks:
    - import_tasks: tasks/dotfiles.yml
    - import_tasks: tasks/ssh.yml
    - import_tasks: tasks/bat.yml
    - import_tasks: tasks/docker.yml
      become: true
